stages:
  - test
  - helm

unit_tests:
  image: python:3.12
  stage: test
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest -v

helm_check:
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  stage: helm
  script:
    - helm lint helm/ci-demo
    - helm template ci-demo helm/ci-demo
